[project]
name = "ai-enabled-contracts-lab"
version = "0.1.0"
description = "A PyTorch-first learning workbench for fine-tuning contract analysis models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AI-Enabled Contracts Lab contributors" }]
keywords = ["fine-tuning", "legal-ai", "pytorch", "streamlit", "transformers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate>=1.2",
  "altair>=5.5",
  "datasets>=3.2",
  "fastapi>=0.116",
  "nbformat>=5.10",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pypdf>=5.1",
  "pypdfium2>=5.12,<6",
  "python-docx>=1.1",
  "rapidocr-onnxruntime>=1.4.4,<2",
  "safetensors>=0.5",
  "scikit-learn>=1.6",
  "striprtf>=0.0.32",
  "streamlit>=1.57",
  "transformers>=4.52,<6",
  "uvicorn>=0.35",
  "wandb>=0.19",
  "xlrd>=2.0",
  "extract-msg>=0.55",
]

[project.optional-dependencies]
cpu = [
  "torch==2.13.0",
]
cu129 = [
  "torch==2.13.0",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu129" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu129", extra = "cu129" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[project.scripts]
contractlab = "contractlab.cli:main"
ai-contracts-lab = "contractlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contractlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
