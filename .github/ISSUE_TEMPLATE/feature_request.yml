name: Feature request
description: Propose a focused teaching or workbench improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: learning_problem
    attributes:
      label: Learning problem
      description: What should a learner understand or accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the UI, code, and expected output.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, licensing, and legal-AI considerations
      description: Note any new data, models, network services, or user-risk implications.
